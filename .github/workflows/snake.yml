name: Generate Snake Animation

on:
  schedule:
    # Runs at 12 AM UTC every day
    - cron: "0 0 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    # IMPORTANT: Grants the required permissions to push to the 'output' branch
    permissions:
      contents: write

    steps:
      # Step 1: Checkout the repository context
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Step 2: Generate the snake files
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ishanbagra18
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          # Required to fetch your contribution graph without hitting rate limits
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Push the generated files to the 'output' branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
